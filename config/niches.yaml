# Eine Nische = ein Satz Accounts (TikTok, Instagram, Facebook, YouTube, Snapchat).
# "upload_profile" ist der Profilname bei Upload-Post, unter dem genau die Accounts
# dieser Nische verbunden sind. So landen Videos nie im falschen Account.
#
# mode: bilder  -> Standbilder mit Zoom + ElevenLabs-Stimme + Untertitel (günstig)
# mode: video   -> echte KI-Videoclips mit Ton/Dialog vom Videomodell (teurer)
# series: true  -> jede Folge knüpft an die vorherige an (Cliffhanger, "Folge N")
# characters    -> feste Figuren, deren Aussehen in jeden Prompt übernommen wird
# posting_times -> Upload-Slots (Uhrzeit in "timezone"); "freigeben" verteilt Videos darauf
# active: false -> Kanal pausiert ("erstellen --alle" überspringt ihn)
# subtitle_color -> Farbe der Untertitel im Bilder-Modus (Markenfarbe)
#
# Reihenfolge = Priorität laut Marktanalyse trends/2026-10-11-marktanalyse.md
# Branding (Namen, Bios, Profilbilder) steht in branding/BRANDING.md.

niches:
  kapitalverbrechen:
    brand: Kapitalverbrechen
    mode: bilder
    language: de
    topic: >
      "Kapitalverbrechen" erzählt die spektakulärsten wahren Geschichten über Geld: Betrüger,
      Hochstapler, Coups, Börsencrashs, Spekulationsblasen und Firmenpleiten. Jede Folge ist eine
      "Akte" mit Hook, Aufstieg, Wendepunkt, Absturz und einer Lehre für das eigene Geld.
      Zuerst historische Fälle (Victor Lustig, Ponzi, Tulpenmanie, Südseeblase, John Law),
      später auch moderne Fälle, aber nur gut belegte Fakten aus seriösen Quellen.
      Keine Anlageberatung, keine Kauf- oder Verkaufsempfehlungen, keine Spekulation über
      Schuld, die nicht gerichtlich festgestellt ist.
    tone: spannend wie ein True-Crime-Podcast, sachlich, mit trockenem Humor, kurze Sätze
    style: >
      cinematic film noir illustration, 1920s to 1980s period detail, black and gold color palette
      with deep shadows and a single red accent, dramatic low-key lighting, graphic novel look,
      faces in shadow or seen from behind, highly detailed
    voice_id: "HIER_ELEVENLABS_VOICE_ID"
    subtitle_color: "#F2C14E"
    scenes: 8
    upload_profile: kapitalverbrechen
    platforms: [tiktok, instagram, facebook, youtube]
    hashtags: ["#kapitalverbrechen", "#truecrime", "#geld", "#betrug", "#wirtschaft"]
    timezone: Europe/Berlin
    posting_times: ["20:00"]

  saftladen:
    brand: Saftladen
    mode: video
    series: true
    language: de
    topic: >
      "Saftladen" ist eine Reality-Soap in einer Obstschale auf der Küchentheke einer WG.
      Die Früchte flirten, lästern, intrigieren und bilden Paare. Am Ende jeder Woche
      entscheidet die Schale, wer rausfliegt, und wer rausfliegt, landet im Mixer (Smoothie).
      Running Gags: der Mixer als Drohung ("Pass auf, sonst Smoothie!"), Zitrone Zoe verbreitet
      jedes Gerücht, Banane Bernd wird langsam braun und hat Angst davor.
      Lustig und überdreht. Nichts Sexuelles, keine echte Gewalt, kein Ekel.
    tone: dramatisch-übertrieben wie eine Reality-Soap, schnelle Dialoge, viel Humor
    style: >
      3D animated, Pixar-like, glossy fruit characters with expressive faces, big eyes and tiny
      arms, sitting in a white ceramic fruit bowl on a sunny kitchen counter, warm lighting,
      shallow depth of field, cinematic close-ups, reality-TV camera feel
    characters:
      - name: Erdbeere Emma
        look: a glossy red strawberry girl with green leaf hair, big blue eyes, pink lipstick
      - name: Banane Bernd
        look: a tall yellow banana guy with a few brown freckles, sunglasses on his head, gold chain
      - name: Aubergine Alex
        look: a purple eggplant guy with a slick green stem quiff, smug smile, tiny leather jacket
      - name: Zitrone Zoe
        look: a small bright yellow lemon girl with round glasses and a sour, curious expression
      - name: Kiwi Kim
        look: a fuzzy brown kiwi girl, cut open on top showing bright green flesh like a hairdo, shy smile
    scenes: 4
    upload_profile: saftladen
    platforms: [tiktok, instagram, facebook, youtube]
    hashtags: ["#saftladen", "#obstdrama", "#kidrama", "#fruitloveisland", "#fyp"]
    timezone: Europe/Berlin
    posting_times: ["19:00"]

  slicelab:
    brand: SliceLab
    # pausiert: Clips unter 60 s verdienen bei TikTok nichts, Markt seit 2025 gesättigt
    active: false
    mode: video
    language: none (no speech, only sounds; title and captions in English)
    topic: >
      Oddly satisfying ASMR: a razor-sharp knife slowly slices through unusual materials
      (glass fruits, crystals, lava, soap, jelly, ice, gemstones, chocolate, honeycomb glass),
      macro close-ups, revealing surprising layers inside. Every video a new object-material pair.
    tone: calm, hypnotic, satisfying
    style: >
      macro close-up, studio lighting, pure black background, ultra realistic, 4k, slow motion,
      crisp detailed ASMR cutting and crackling sounds, no music, no voice
    scenes: 2
    upload_profile: slicelab
    platforms: [tiktok, instagram, facebook, youtube]
    hashtags: ["#asmr", "#oddlysatisfying", "#satisfying", "#aiasmr", "#fyp"]
    # 19:00 Berlin = Abend in Europa / Mittag in den USA, 01:00 Berlin = Abend an der US-Ostküste
    timezone: Europe/Berlin
    posting_times: ["19:00", "01:00"]

  sagenhaft:
    brand: Sagenhaft
    mode: bilder
    series: true
    language: de
    topic: >
      "Sagenhaft" erzählt griechische, nordische und ägyptische Mythen als spannende
      Fortsetzungsgeschichte in 60-Sekunden-Folgen. Staffel 1: die Irrfahrt des Odysseus,
      danach die nächste große Sage. Nur gemeinfreie Überlieferung, nah am Original,
      aber erzählt wie ein Thriller.
    tone: episch, spannend, wie ein Hörspiel-Erzähler, kurze Sätze
    style: >
      epic fantasy oil painting, dramatic chiaroscuro lighting, cinematic composition,
      ancient mediterranean world, highly detailed, rich deep colors
    characters:
      - name: Odysseus
        look: Odysseus, a bearded Greek warrior in his forties with curly dark hair, bronze armor and a red cloak
    voice_id: "HIER_ELEVENLABS_VOICE_ID"
    subtitle_color: "#FFFFFF"
    scenes: 7
    upload_profile: sagenhaft
    platforms: [tiktok, instagram, facebook, youtube]
    hashtags: ["#sagenhaft", "#mythologie", "#odysseus", "#griechischemythologie", "#fyp"]
    timezone: Europe/Berlin
    posting_times: ["18:00"]
